name: Test default region fallback (no AWS_REGION set)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source directory with a test file
        run: |
          mkdir -p /tmp/test-src-region
          echo "region test" > /tmp/test-src-region/region.txt

      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_S3_BUCKET: my-test-bucket
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          # Intentionally omit AWS_REGION — should default to us-east-1
          SOURCE_DIR: /tmp/test-src-region

      - name: Assert action ran (passed validation, attempted sync)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should pass the guard checks (all required vars set)
          # and attempt the sync. It will fail at the AWS API call with
          # invalid credentials, but NOT with a missing-variable error.
          # Either failure (AWS auth error) or success is acceptable here.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran past validation checks (default region applied)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
