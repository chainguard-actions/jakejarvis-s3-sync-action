name: Test invalid AWS credentials (sync attempt fails gracefully)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source directory with test files
        run: |
          mkdir -p /tmp/test-src
          echo "hello world" > /tmp/test-src/hello.txt
          echo "another file" > /tmp/test-src/another.txt

      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_S3_BUCKET: my-test-bucket
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_REGION: us-east-1
          SOURCE_DIR: /tmp/test-src
          DEST_DIR: test-prefix/

      - name: Assert action failed gracefully with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With invalid (example) credentials, the action should pass the
          # validation checks and attempt the sync, then fail at the AWS API
          # call with an authentication error — not a missing-variable error.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (invalid credentials rejected by AWS)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but not a test failure)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
