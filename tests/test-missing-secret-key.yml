name: Test missing AWS_SECRET_ACCESS_KEY
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source directory with a test file
        run: |
          mkdir -p /tmp/test-src
          echo "hello world" > /tmp/test-src/hello.txt

      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_S3_BUCKET: my-test-bucket
          AWS_ACCESS_KEY_ID: fake-key-id
          # Intentionally omit AWS_SECRET_ACCESS_KEY to trigger the guard
          AWS_REGION: us-east-1
          SOURCE_DIR: /tmp/test-src

      - name: Assert action failed due to missing AWS_SECRET_ACCESS_KEY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when AWS_SECRET_ACCESS_KEY is not set"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without AWS_SECRET_ACCESS_KEY"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
